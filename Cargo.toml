[package]
name = "u2dm"
version = "0.1.0"
edition = "2024"
description = "Unable to decrypt message. A Matrix chat client built with Slint UI"
license = "AGPL-3.0-or-later"
#repository = ""
readme = "README.md"
keywords = ["matrix", "chat", "slint"]
categories = ["network-programming"]

[workspace]
members = ["crates/ui"]

[features]
default = ["video", "compiled"]
compiled = ["u2dm-ui/codegen"]
interpreted = ["dep:slint-interpreter", "dep:lucide-slint"]
demo = ["dep:axum"]
video = ["dep:alsa", "dep:cpal", "dep:ffmpeg-next"]

[dependencies]
axum = { version = "0.8.9", optional = true, default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "unstable-locales",
] }
cpal = { version = "0.18.2", optional = true, features = ["pulseaudio"] }
directories = "6.0.0"
emojis = "0.9.0"
ffmpeg-next = { version = "9.0.0", optional = true }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tiff",
] }
infer = "0.22.0"
keyring-core = "1.0.0"
lucide-slint = { version = "1.46.0", optional = true }
matrix-sdk = { version = "0.19.0", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    "local-server",
    "rustls-aws-lc-rs",
] }
matrix-sdk-base = { version = "0.19.0", default-features = false }
matrix-sdk-ui = { version = "0.19.0", default-features = false }
mime = "0.3.17"
mime_guess = { version = "2.0.5", default-features = false }
open = "5.4.3"
pure-rust-locales = "0.8.2"
rand = "0.10.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
slint = { version = "1.18.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "unstable-winit-030",
    "renderer-femtovg",
    "accessibility",
    "gettext",
] }
slint-interpreter = { version = "1.18.0", optional = true, default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
] }
strum = { version = "0.28.0", features = ["derive"] }
sys-locale = "0.3.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
u2dm-ui = { path = "crates/ui", default-features = false }
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.11.0", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
xdg = "3.0.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = [
    "crypto-rust",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[build-dependencies]
lucide-slint = "1.46.0"

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
#cargo = { level = "deny", priority = -1 }
disallowed_types = "deny"
disallowed_methods = "deny"
pub_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
vec_box = "deny"
large_enum_variant = "deny"
await_holding_lock = "deny"
future_not_send = "deny"
cognitive_complexity = "deny"
needless_collect = "deny"
let_underscore_must_use = "deny"
absolute_paths = "deny"
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
uninlined_format_args = "allow"


[profile.dev]
opt-level = 1
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.u2dm-ui]
debug = false

[profile.inspect]
inherits = "dev"
incremental = false

[profile.inspect.package."*"]
opt-level = 3
debug = false

[profile.inspect.package.u2dm-ui]
debug = false
